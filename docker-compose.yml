services:
  txtify:
    build:
      context: .
      dockerfile: Dockerfile
    image: lkmeta/txtify:latest
    container_name: txtify_container
    ports:
      - "8011:8011"
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      # Persist transcriptions and job state; never mount the whole repo over
      # /app — that masks the image's code with whatever is on the host.
      - ./output:/app/output
      # Persist downloaded Whisper/torch models across container rebuilds, so a
      # `docker compose up --build` doesn't re-download them (they live in
      # /root/.cache, which is otherwise part of the throwaway container layer).
      - model-cache:/root/.cache
    restart: unless-stopped
    # Healthcheck comes from the image (see Dockerfile HEALTHCHECK).

volumes:
  model-cache:
